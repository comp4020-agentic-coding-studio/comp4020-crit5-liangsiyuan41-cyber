<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Make 21</title>
    <meta
      name="description"
      content="Make 21: combine four number tiles with +, -, x, / to reach exactly 21, across 21 levels."
    />

    <!--
      The link-preview card: public/card.png, 1200x630 --- replace it. The URL
      resolves against this page, like any link. No og:title/og:description:
      scrapers fall back to the <title> and description above.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:image" content="./card.png" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header>
      <nav aria-label="Primary">
        <a href="./">Make 21</a>
      </nav>
    </header>
    <main>
      <h1>Make 21</h1>

      <section id="level-select">
        <h2>Choose a level</h2>
        <div id="level-grid"></div>
      </section>

      <section id="game" hidden>
        <p><button type="button" id="back-to-levels">← Levels</button></p>
        <h2 id="game-title">Level</h2>

        <div id="tiles" role="group" aria-label="Number tiles"></div>
        <div id="operators" role="group" aria-label="Operators"></div>
        <p id="current-value" aria-live="polite"></p>
        <ol id="history" aria-label="Calculation steps"></ol>
        <p id="move-error" aria-live="polite"></p>

        <div id="controls">
          <button type="button" id="undo">Undo</button>
          <button type="button" id="reset">Reset</button>
          <button type="button" id="view-answer">View Answer</button>
          <button type="button" id="submit">Submit</button>
        </div>

        <div id="feedback" aria-live="polite"></div>
      </section>

      <section id="congrats" hidden>
        <h2>Congratulations!</h2>
        <p>You've completed all 21 levels of Make 21.</p>
        <div id="congrats-controls">
          <button type="button" id="congrats-back">Back to Levels</button>
          <button type="button" id="congrats-play-again">Play Again</button>
        </div>
      </section>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
